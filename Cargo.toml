[package]
name = "poke"
version = "0.1.0"
edition = "2021"
description = "Agent attention aggregator — detects AI coding agents waiting for human input across tmux sessions"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
libc = "0.2"
ratatui = "0.29"
crossterm = "0.28"

[dev-dependencies]
tempfile = "3"
